<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Max — تنظیمات بهینه بازی‌ها</title>
<meta name="description" content="بهترین تنظیمات گرافیکی و کارایی برای صدها بازی محبوب. سبک، سریع، رایگان.">

<style>
@font-face {
    font-family: 'Vazirmatn';
    src: url('fonts/vazirmatn_regular.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'Vazirmatn';
    src: url('fonts/vazirmatn_bold.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
}
@font-face {
    font-family: 'Inter';
    src: url('fonts/inter_regular.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'Inter';
    src: url('fonts/inter_bold.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
}

:root {
    --bg: #0E0E10;
    --surface: #18181B;
    --surface-alt: #212124;
    --border: #2A2A2E;
    --text: #F5F5F7;
    --text-dim: #9B9BA3;
    --red: #FF3B41;
    --red-dark: #B8151A;
    --red-soft: #3A1518;
    --green: #2ECC71;
    --green-bg: #123321;
    --yellow: #F5C518;
    --yellow-bg: #332B0E;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --glass-highlight: rgba(255,255,255,0.06);
    --radius: 16px;
    --font-fa: 'Vazirmatn', sans-serif;
    --font-en: 'Inter', sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    background: var(--bg);
    background-image:
        radial-gradient(circle at 15% 0%, rgba(255,59,65,0.08), transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(255,59,65,0.05), transparent 40%);
    color: var(--text);
    font-family: var(--font-fa);
    line-height: 1.6;
    min-height: 100vh;
}

body.lang-en {
    font-family: var(--font-en);
    direction: ltr;
}

a { color: inherit; }

:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
    border-radius: 6px;
}

/* ===== Header ===== */
header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(14,14,16,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
}

.brand-name {
    font-weight: 700;
    font-size: 18px;
    flex: 1;
}

.lang-toggle {
    display: flex;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
}

.lang-toggle button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

.lang-toggle button.active {
    background: var(--red);
    color: #fff;
}

/* ===== Hero / Search ===== */
.hero {
    max-width: 720px;
    margin: 48px auto 36px;
    padding: 0 20px;
    text-align: center;
}

.hero h1 {
    font-size: 26px;
    margin: 0 0 8px;
    font-weight: 700;
}

.hero p {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0 0 28px;
}

.search-wrap {
    position: relative;
}

.search-wrap svg {
    position: absolute;
    inset-inline-start: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 19px;
    height: 19px;
    color: var(--text-dim);
    pointer-events: none;
}

#search {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 16px 50px;
    border-radius: 14px;
    transition: border-color 0.2s ease, background 0.2s ease;
}

#search::placeholder { color: var(--text-dim); }

#search:focus {
    outline: none;
    border-color: var(--red);
    background: rgba(255,59,65,0.05);
}

/* ===== Game grid ===== */
main { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

#count {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    text-align: start;
    padding: 0;
    color: inherit;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s cubic-bezier(0.34, 1.2, 0.64, 1), border-color 0.18s ease, box-shadow 0.18s ease;
    position: relative;
}

.card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    pointer-events: none;
}

.card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(255,59,65,0.35);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

.card:active { transform: translateY(-1px) scale(0.99); }

.card-image {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    background: var(--surface-alt);
    display: block;
}

.card-body { padding: 14px 16px 16px; }

.card-name {
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 8px;
}

.tags { display: flex; gap: 6px; flex-wrap: wrap; }

.tag {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 7px;
}

.tag-green { background: var(--green-bg); color: var(--green); }
.tag-yellow { background: var(--yellow-bg); color: var(--yellow); }
.tag-youtube { background: var(--red-soft); color: var(--red); }

.state-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
}

.skeleton {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
}
.skeleton .card-image { background: var(--surface-alt); }
.skeleton .sk-line {
    height: 14px;
    background: var(--surface-alt);
    border-radius: 6px;
    margin: 14px 16px 8px;
}
.skeleton .sk-line.short { width: 60%; margin-bottom: 16px; }

@media (prefers-reduced-motion: no-preference) {
    .skeleton .card-image, .skeleton .sk-line {
        animation: pulse 1.4s ease-in-out infinite;
    }
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ===== Modal ===== */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }

@media (min-width: 640px) {
    .modal-backdrop { align-items: center; }
}

.modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(24px);
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-backdrop.open .modal { transform: translateY(0); }

@media (min-width: 640px) {
    .modal { border-radius: 20px; }
}

.modal-image { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }

.modal-body { padding: 20px; }

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.modal-title { font-size: 19px; font-weight: 700; margin: 0; }

.modal-close {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
}

.settings-block { margin-bottom: 14px; }

.settings-text {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    white-space: pre-wrap;
    margin-top: 8px;
    line-height: 1.7;
}

.youtube-box {
    text-align: center;
    padding: 24px 16px;
}

.youtube-box p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 12px 0 18px;
}

.btn-youtube {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, var(--red), var(--red-dark));
    color: #fff;
    border: none;
    padding: 13px 26px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
}
.btn-youtube:hover { filter: brightness(1.08); }

.empty-settings {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px 0;
}

/* ===== Footer ===== */
footer {
    text-align: center;
    padding: 32px 20px 48px;
    color: var(--text-dim);
    font-size: 13px;
    border-top: 1px solid var(--border);
}

footer a {
    color: var(--red);
    text-decoration: none;
    font-weight: 700;
}

@media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">PC</div>
        <div class="brand-name">PC Max</div>
        <div class="lang-toggle" role="group" aria-label="زبان / Language">
            <button id="btn-fa" class="active" onclick="setLang('fa')">فا</button>
            <button id="btn-en" onclick="setLang('en')">EN</button>
        </div>
    </div>
</header>

<section class="hero">
    <h1 id="t-title">تنظیمات بهینه‌ی بازی‌های محبوب</h1>
    <p id="t-subtitle">اسم بازی‌ت رو جستجو کن، تنظیمات بهینه‌ش رو ببین</p>
    <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" autocomplete="off">
    </div>
</section>

<main>
    <div id="count"></div>
    <div class="grid" id="grid"></div>
</main>

<footer>
    <p id="t-footer">این وب‌سایت رایگانه و دائم آپدیت می‌شه · نسخه‌ی اندروید هم داریم</p>
    <a href="https://github.com/alitanhaii1970-commits/game-settings-app/releases/latest" id="t-download">دانلود اپ اندروید ↓</a>
</footer>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script>
const FIREBASE_PROJECT = "pc-max-a0a4b";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/games?pageSize=300`;

let allGames = [];
let lang = 'fa';

const STRINGS = {
    fa: {
        title: 'تنظیمات بهینه‌ی بازی‌های محبوب',
        subtitle: 'اسم بازی‌ت رو جستجو کن، تنظیمات بهینه‌ش رو ببین',
        searchPlaceholder: 'مثلاً Elden Ring…',
        loading: 'در حال بارگذاری بازی‌ها…',
        error: 'اتصال برقرار نشد. یه بار دیگه امتحان کن.',
        noResults: 'بازی‌ای با این اسم پیدا نشد',
        countSuffix: 'بازی',
        green: 'سبز',
        yellow: 'زرد',
        youtube: 'یوتیوب',
        greenTitle: 'تنظیمات بهینه سبز',
        yellowTitle: 'تنظیمات بهینه زرد',
        youtubeHint: 'برای دیدن تنظیمات این بازی روی لینک یوتیوب کلیک کنید',
        watchYoutube: 'مشاهده در یوتیوب',
        noSettings: 'برای این بازی هنوز تنظیماتی ثبت نشده.',
        footer: 'این وب‌سایت رایگانه و دائم آپدیت می‌شه · نسخه‌ی اندروید هم داریم',
        download: 'دانلود اپ اندروید ↓'
    },
    en: {
        title: 'Optimal Settings for Popular Games',
        subtitle: 'Search your game to see its optimal settings',
        searchPlaceholder: 'e.g. Elden Ring…',
        loading: 'Loading games…',
        error: "Couldn't connect. Please try again.",
        noResults: 'No game found with that name',
        countSuffix: 'games',
        green: 'Green',
        yellow: 'Yellow',
        youtube: 'YouTube',
        greenTitle: 'Green Optimal Settings',
        yellowTitle: 'Yellow Optimal Settings',
        youtubeHint: "Tap the YouTube link to see this game's settings",
        watchYoutube: 'Watch on YouTube',
        noSettings: 'No settings registered for this game yet.',
        footer: 'This website is free and always up to date · Android app also available',
        download: 'Download Android App ↓'
    }
};

function setLang(l) {
    lang = l;
    document.body.classList.toggle('lang-en', l === 'en');
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
    document.documentElement.lang = l;
    document.getElementById('btn-fa').classList.toggle('active', l === 'fa');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');

    const s = STRINGS[l];
    document.getElementById('t-title').textContent = s.title;
    document.getElementById('t-subtitle').textContent = s.subtitle;
    document.getElementById('search').placeholder = s.searchPlaceholder;
    document.getElementById('t-footer').textContent = s.footer;
    document.getElementById('t-download').textContent = s.download;

    renderGrid(document.getElementById('search').value);
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

function parseGame(doc) {
    const f = doc.fields || {};
    return {
        id: doc.name.split('/').pop(),
        name: f.name?.stringValue || '',
        imageUrl: f.imageUrl?.stringValue || '',
        settingsGreen: f.settingsGreen?.stringValue || '',
        settingsYellow: f.settingsYellow?.stringValue || '',
        youtubeUrl: f.youtubeUrl?.stringValue || '',
        showYoutubeButton: f.showYoutubeButton?.booleanValue || false
    };
}

async function loadGames() {
    const grid = document.getElementById('grid');
    grid.innerHTML = Array.from({length: 8}).map(() => `
        <div class="skeleton">
            <div class="card-image"></div>
            <div class="sk-line"></div>
            <div class="sk-line short"></div>
        </div>
    `).join('');

    try {
        const res = await fetch(FIRESTORE_URL);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        allGames = (data.documents || []).map(parseGame).sort((a, b) => a.name.localeCompare(b.name));
        renderGrid('');
    } catch (e) {
        grid.innerHTML = `<div class="state-msg">${STRINGS[lang].error}</div>`;
    }
}

function renderGrid(query) {
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const s = STRINGS[lang];
    const q = query.trim().toLowerCase();

    const filtered = q ? allGames.filter(g => g.name.toLowerCase().includes(q)) : allGames;

    countEl.textContent = `${filtered.length} ${s.countSuffix}`;

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="state-msg" style="grid-column:1/-1">${s.noResults}</div>`;
        return;
    }

    grid.innerHTML = filtered.map(g => {
        const hasYoutube = g.showYoutubeButton && g.youtubeUrl;
        let tags = '';
        if (hasYoutube) {
            tags = `<span class="tag tag-youtube">▶ ${s.youtube}</span>`;
        } else {
            if (g.settingsGreen) tags += `<span class="tag tag-green">${s.green}</span>`;
            if (g.settingsYellow) tags += `<span class="tag tag-yellow">${s.yellow}</span>`;
        }
        return `
            <button class="card" onclick="openModal('${g.id}')">
                <img class="card-image" src="${escapeHtml(g.imageUrl)}" alt="" loading="lazy" onerror="this.style.opacity=0">
                <div class="card-body">
                    <p class="card-name">${escapeHtml(g.name)}</p>
                    <div class="tags">${tags}</div>
                </div>
            </button>
        `;
    }).join('');
}

function openModal(id) {
    const g = allGames.find(x => x.id === id);
    if (!g) return;
    const s = STRINGS[lang];
    const hasYoutube = g.showYoutubeButton && g.youtubeUrl && /^https?:\/\//.test(g.youtubeUrl);

    let bodyHtml = '';
    if (hasYoutube) {
        bodyHtml = `
            <div class="youtube-box">
                <p>${s.youtubeHint}</p>
                <a class="btn-youtube" href="${escapeHtml(g.youtubeUrl)}" target="_blank" rel="noopener">▶ ${s.watchYoutube}</a>
            </div>
        `;
    } else if (g.settingsGreen || g.settingsYellow) {
        if (g.settingsGreen) {
            bodyHtml += `
                <div class="settings-block">
                    <span class="tag tag-green">${s.greenTitle}</span>
                    <div class="settings-text">${escapeHtml(g.settingsGreen)}</div>
                </div>`;
        }
        if (g.settingsYellow) {
            bodyHtml += `
                <div class="settings-block">
                    <span class="tag tag-yellow">${s.yellowTitle}</span>
                    <div class="settings-text">${escapeHtml(g.settingsYellow)}</div>
                </div>`;
        }
    } else {
        bodyHtml = `<p class="empty-settings">${s.noSettings}</p>`;
    }

    document.getElementById('modal').innerHTML = `
        <img class="modal-image" src="${escapeHtml(g.imageUrl)}" alt="" onerror="this.style.display='none'">
        <div class="modal-body">
            <div class="modal-header">
                <h2 class="modal-title">${escapeHtml(g.name)}</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="close">✕</button>
            </div>
            ${bodyHtml}
        </div>
    `;

    const backdrop = document.getElementById('modalBackdrop');
    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

document.getElementById('search').addEventListener('input', (e) => {
    renderGrid(e.target.value);
});

loadGames();
</script>

</body>
</html>
